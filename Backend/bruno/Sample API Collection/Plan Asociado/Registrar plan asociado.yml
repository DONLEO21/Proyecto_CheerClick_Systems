info:
  name: Registrar plan asociado
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/plan-asociado
  body:
    type: json
    data: |-
      {
        "nombre": "Black",
        "valor": 150000,
        "estado": "Inactivo"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
