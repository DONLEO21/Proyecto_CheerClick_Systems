info:
  name: Verifica autenticacion
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/api/auth/renew-token
  body:
    type: json
    data: |-
      {
        "nombre": "Leo",
        "apellido": "Morales",
        "email": "Leo@gmail.com",
        "contrasena": "012345",
        "rol": "Atleta"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
