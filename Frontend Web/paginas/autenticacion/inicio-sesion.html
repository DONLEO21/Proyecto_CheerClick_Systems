<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
</head>
<body>
    <header>
        <nav>
            <div class="nav-contenedor">
                <div class="logo">
                    <img src="/Frontend Web/img/logo/logo-btc.png" alt="Logo">
                </div>
                <div class="nav-links">
                    <ul>
                        <li><a href="../publico/index.html#nosotros">Nosotros</a></li>
                        <li class="menu-desplegable">
                            <a href="#">Programas</a>
                            <ul class="submenu">
                                <li><a href="../publico/index.html#servicios">Servicios</a></li>
                                <li><a href="../publico/index.html#niveles">Niveles</a></li>
                                <li><a href="../publico/index.html#horarios">Horarios</a></li>
                            </ul>
                        </li>
                        <li><a href="../publico/index.html#footer">Contacto</a></li>
                        <li><a href="inicio-sesion.html">Iniciar sesión</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="inicio-sesion">
            <div class="contenedor">

            <header class="inicio-header">
                <img src="/Frontend Web/img/logo/logo-btc.png" alt="Logo Blood Tigers">
                <h1>BIENVENIDO</h1>
                <p>Ingrese a su panel</p>
            </header>

            <form action="#" method="post">
                <div class="form-grupo">
                    <label for="rol">Rol</label>
                    <select id="rol" name="rol">
                        <option value="" disabled selected>Seleccione rol...</option>
                        <option value="atleta">Atleta</option>
                        <option value="entrenador">Entrenador</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
 
                <div class="form-grupo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="Su@gmail.com">
                </div>
 
                <div class="form-grupo">
                    <label for="contrasena">Contraseña</label>
                    <div class="contrasena-contenedor">
                        <input type="password" id="contrasena" name="contrasena" placeholder="••••••••">
                        <div class="input-ojo-icono"> 
                            <button type="button" class="btn-ver-contrasena">👁</button> 
                        </div>
                    </div>
                </div>

                <div class="fila-opciones">
                    <label>
                        <input type="checkbox" name="recordar">
                        Recordarme
                    </label>
                    <a href="recuperar-contrasena.html">Olvidé mi contraseña</a>
                </div>
 
                <p class="error">Complete todos los campos.</p>
 
                <button type="submit" class="btn-principal">
                    Iniciar Sesión
                </button>
            </form>
 
        <p class="pie">¿No tiene cuenta? <a href="registro.html">Regístrese</a></p>
  </div>
</main>
</body>
</html>
