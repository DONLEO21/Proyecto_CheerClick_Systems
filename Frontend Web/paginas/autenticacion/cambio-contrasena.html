<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Frontend Web/css/styles.css">
    <title>Cambio contraseña</title>
</head>
<body>
    <header>
        <nav class="nav-publica">
            <div class="nav-publica-contenedor">
                <div class="logo">
                    <img src="/Frontend Web/img/logo/logo-btc.png" alt="Logo">
                </div>
                <div class="nav-publica-links">
                    <ul>
                        <li><a href="../publico/index.html#hero">Home</a></li>
                        <li><a href="../publico/index.html#nosotros">Nosotros</a></li>
                        <li class="menu-desplegable">
                            <a href="#">Programas</a>
                            <ul class="submenu">
                                <li><a href="../publico/index.html#servicios">Servicios</a></li>
                                <li><a href="../publico/index.html#niveles">Niveles</a></li>
                                <li><a href="../publico/index.html#horarios">Horarios</a></li>
                            </ul>
                        </li>
                        <li><a href="../publico/index.html#footer">Contacto</a></li>
                        <li><a href="inicio-sesion.html">Iniciar sesión</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="cambio-contrasena">
            <div class="contenedor">
                <header>
                    <img src="/Frontend Web/img/logo/logo-btc.png" alt="Logo">
                    <h1>Nueva Contraseña</h1>
                    <p>
                        Cree una contraseña segura para su cuenta.
                    </p>
                    <div class="progreso">
                        <div class="paso"></div>
                        <div class="paso"></div>
                        <div class="paso activo"></div>
                    </div>
                </header>

                <form id="form-cambio-contrasena">
                    <div class="contrasena-contenedor">
                        <label for="nueva-contrasena">Nueva Contraseña</label>
                        <input type="password" name="nueva-contrasena" id="nueva-contrasena" required placeholder="Mínimo 8 caracteres" minlength="8" maxlength="16">
                        <div class="input-ojo-icono"> 
                            <button type="button" class="btn-ver-contrasena">👁</button> 
                        </div>
                    
                        <div class="seguridad-contrasena">
                            <div class="barra activo"></div>
                            <div class="barra"></div>
                            <div class="barra"></div>
                        </div>
                        <p>Débil</p>
                    </div>

                    <div class="contrasena-contenedor">
                        <label for="confirmar-contrasena">Confirmar Contraseña</label>
                        <input type="password" name="confirmar-contrasena" id="confirmar-contrasena" required placeholder="Repita la contraseña" minlength="8" maxlength="16">
                        <div class="input-ojo-icono"> 
                            <button type="button" class="btn-ver-contrasena">👁</button> 
                        </div>

                    </div>
                    
                    <button type="submit" class="btn btn-primario">
                        Guardar contraseña
                    </button>
                </form>
                <a href="/Frontend Web/paginas/autenticacion/verificar-codigo.html" class="link-texto">&#8592; Volver</a>
            </div>
        </section>
    </main>

    <!-- modal cambio exitoso contraseña -->
     <dialog id="modalContrasena" class="modal">

        <div class="modal-contenido">
            <img src="/Frontend Web/img/iconos/marca-de-verificacion.png" alt="Contraseña actualizada">

            <h2>¡Listo!</h2>

            <p>
                Su contraseña fue actualizada correctamente.
            </p>

            <div class="mensaje-validacion mensaje-validacion-contrasena">
                
                <p>
                    Ya puede iniciar sesión con su nueva contraseña.
                </p>
            </div>

            <button type="button" class="btn btn-primario" onclick="cerrarModalContrasena()">
                &#8592; Ir a Inicio de Sesión
            </button>
        </div>
    </dialog>
    
    <script>
        const formulario = document.getElementById("form-cambio-contrasena");
        const modal = document.getElementById("modalContrasena");
        
            formulario.addEventListener("submit", function(e){
                e.preventDefault();
                modal.showModal();
            }
        );

        function cerrarModalContrasena(){
            modal.close();
            window.location.href = "/Frontend Web/paginas/autenticacion/inicio-sesion.html";
        }

</script>
</body>
</html>
