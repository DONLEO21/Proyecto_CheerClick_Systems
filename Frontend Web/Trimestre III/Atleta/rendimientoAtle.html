    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ── Tabs propios ──────────────────────────────────────────────
        const tabBtns   = document.querySelectorAll('.tab-btn');
        const tabPanels = document.querySelectorAll('.tab-panel');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.tab;
                tabBtns.forEach(b => b.classList.remove('activo'));
                tabPanels.forEach(p => p.classList.remove('activo'));
                btn.classList.add('activo');
                document.getElementById('tab-' + target).classList.add('activo');
            });
        });

        // ── Filtros de habilidades ────────────────────────────────────
        const btnsFiltro = document.querySelectorAll('.btn-filtro');
        const niveles    = document.querySelectorAll('.nivel-habilidades');

        btnsFiltro.forEach(btn => {
            btn.addEventListener('click', () => {
                const nivel = btn.dataset.nivel;
                btnsFiltro.forEach(b => b.classList.remove('btn-filtro--activo'));
                niveles.forEach(n => n.classList.remove('activo'));
                btn.classList.add('btn-filtro--activo');
                document.querySelector(`.nivel-habilidades[data-nivel="${nivel}"]`).classList.add('activo');
            });
        });

        // ── Modal Bootstrap ───────────────────────────────────────────
        const modalEl    = document.getElementById('modal-justificacion');
        const bsModal    = new bootstrap.Modal(modalEl);
        const textarea   = document.getElementById('motivo-textarea');
        const btnEnviar  = document.getElementById('btn-enviar-justificacion');
        const toast      = document.getElementById('toast');

        function abrirModal(fecha, hora, entrenador) {
            document.getElementById('modal-fecha').textContent      = fecha;
            document.getElementById('modal-hora').textContent       = hora;
            document.getElementById('modal-entrenador').textContent = entrenador;
            textarea.value = '';
            document.getElementById('nombre-archivo').textContent   = '';
            btnEnviar.disabled = true;
            bsModal.show();
        }

        // Abrir desde días del calendario con falta
        document.querySelectorAll('.cal-dia--justificable').forEach(dia => {
            dia.addEventListener('click', () => {
                abrirModal(dia.dataset.fecha, dia.dataset.hora, dia.dataset.entrenador);
            });
        });

        // Abrir desde botón "Justificar" de la tabla
        document.querySelectorAll('.btn-justificar').forEach(btn => {
            btn.addEventListener('click', () => {
                abrirModal(btn.dataset.fecha, btn.dataset.hora, btn.dataset.entrenador);
            });
        });

        // Habilitar botón enviar cuando hay texto suficiente
        textarea.addEventListener('input', () => {
            btnEnviar.disabled = textarea.value.trim().length < 5;
        });

        // Mostrar nombre del archivo adjunto
        document.getElementById('archivo-adjunto').addEventListener('change', function () {
            document.getElementById('nombre-archivo').textContent = this.files[0]?.name ?? '';
        });

        // Enviar justificación
        btnEnviar.addEventListener('click', () => {
            bsModal.hide();
            setTimeout(() => {
                toast.classList.add('visible');
                setTimeout(() => toast.classList.remove('visible'), 3500);
            }, 350);
        });
    </script>
