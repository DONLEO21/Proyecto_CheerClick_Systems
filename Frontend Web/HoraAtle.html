───────────────────────────────────────────────────────── */
const FILTROS = ['todos', 'partner', 'gimnasia', 'acondi', 'coreografia'];

function renderizarFiltros() {
    return FILTROS.map(key => {
        const esActivo = filtroActivo === key;
        if (key === 'todos') {
            return `
            <button class="chip-filtro ${esActivo ? 'activo' : ''}" data-cat="todos" onclick="establecerFiltro('todos')">
                ${ICONOS.calendar}
                <span>Todos</span>
            </button>`;
        }
        const cat = CATEGORIAS[key];
        return `
        <button class="chip-filtro ${esActivo ? 'activo' : ''}" data-cat="${key}" onclick="establecerFiltro('${key}')">
            ${cat.icon}
            <span>${cat.name}</span>
        </button>`;
    }).join('');
}

function establecerFiltro(key) {
    filtroActivo = (filtroActivo === key) ? 'todos' : key;
    renderizarSemana();
}

/* ─────────────────────────────────────────────────────────
   RENDERIZADO DEL STRIP DE DÍAS
───────────────────────────────────────────────────────── */
function renderizarTiraDias(week) {
    const ABBRS = ['L','M','X','J','V','S','D'];
    return ABBRS.map((abbr, i) => {
        let num = week.startDay + i;
        if (num > 30 || num < 1) {
        return '';
}
        const esHoy = week.indiceHoy === i;
        const dotsHtml = week.dots
            .filter(d => d.dayIdx === i)
            .map(d => `<span class="punto ${CATEGORIAS[d.cat].clasePunto}"></span>`)
            .join('');
        return `
        <div class="celda-dia ${esHoy ? 'hoy' : ''}">
            <span class="abrev-dia">${abbr}</span>
            <span class="numero-dia">${num}</span>
            <div class="puntos-dia">${dotsHtml}</div>
        </div>`;
    }).join('');
}

/* ─────────────────────────────────────────────────────────
   RENDERIZADO DE UNA TARJETA
───────────────────────────────────────────────────────── */
function renderizarTarjeta(card, isPast) {
    const cat         = CATEGORIAS[card.cat];
    const claseCabecera = isPast ? 'cabecera-pasado' : cat.claseCabecera;
    const claseAvatar = isPast ? 'avatar-pasado' : cat.claseAvatar;
    const fillPct     = Math.round((card.spots.used / card.spots.total) * 100);
    let   claseRelleno   = isPast ? 'relleno-pasado'
                      : fillPct >= 90 ? 'relleno-completo'
                      : cat.claseRelleno;

    const [tStart, tEnd] = card.time.split('–').map(s => s.trim());

    return `
    <div class="tarjeta-entrenamiento">
        <!-- Cabecera -->
        <div class="cabecera-tarjeta ${claseCabecera}">
            <div class="fila-superior">
                <span class="insignia ${obtenerClaseInsignia(card.insignia)}">${card.insignia}</span>
                <span class="pastilla-duracion">
                    ${ICONOS.clock}
                    ${card.duration}
                </span>
            </div>
            <div class="fila-categoria">
                <div class="icono-categoria-contenedor">${cat.icon}</div>
                <span class="nombre-categoria">${cat.name}</span>
            </div>
        </div>
        <!-- Cuerpo -->
        <div class="cuerpo-tarjeta">
            <div class="fila-info">
                <span class="icono-info">${ICONOS.calendar}</span>
                <span class="texto-info">${card.dateLabel}</span>
            </div>
            <div class="fila-info">
                <span class="icono-info">${ICONOS.clock}</span>
                <span class="texto-info"><strong>${tStart}</strong> – ${tEnd}</span>
            </div>
            <div class="fila-info fila-entrenador">
                <div class="avatar-entrenador ${claseAvatar}">${card.initials}</div>
                <div class="info-entrenador">
                    <span class="nombre-entrenador">${card.trainer}</span>
                    <span class="rol-entrenador">Entrenador principal</span>
                </div>
            </div>
        </div>
        <!-- Pie -->
        <div class="pie-tarjeta">
            <button class="btn-detalles" data-card-id="${card.id}">
                Ver detalles ${ICONOS.arrow}
            </button>
        </div>
    </div>`;
}

function obtenerClaseInsignia(insignia) {
    if (insignia === 'HOY')    return 'insignia-hoy';
    if (insignia === 'PASADO') return 'insignia-pasado';
    return 'insignia-proximo';
}

/* ─────────────────────────────────────────────────────────
   RENDERIZADO COMPLETO DE LA SEMANA
───────────────────────────────────────────────────────── */
function renderizarSemana() {
    const week = SEMANAS[indiceSemanaActual];

    // Etiqueta de rango
    document.getElementById('etiqueta-semana').textContent = week.range;

    // Strip de días
    document.getElementById('tira-dias').innerHTML = renderizarTiraDias(week);

    // Filtros de tipo de entrenamiento
    document.getElementById('filtros-categoria').innerHTML = renderizarFiltros();

    // Tarjetas (aplicando filtro activo)
    const visibleCards = filtroActivo === 'todos'
        ? week.cards
        : week.cards.filter(c => c.cat === filtroActivo);

    document.getElementById('cuadricula-entrenamientos').innerHTML = visibleCards.length
        ? visibleCards.map(card => renderizarTarjeta(card, week.isPast)).join('')
        : `<div class="estado-vacio">
               <span class="icono-vacio">${ICONOS.calendar}</span>
               <p>No hay entrenamientos de tipo "${CATEGORIAS[filtroActivo]?.name ?? filtroActivo}" en esta semana.</p>
           </div>`;

    // Chips de estadísticas (sobre las tarjetas visibles)
    const totalH = visibleCards.reduce((s, c) => s + parseFloat(c.duration), 0);
    const cats   = new Set(visibleCards.map(c => c.cat)).size;
    document.getElementById('stat-sesiones').textContent = `${visibleCards.length} sesion${visibleCards.length !== 1 ? 'es' : ''}`;
    document.getElementById('stat-tiempo').textContent     = `${totalH}h totales`;
    document.getElementById('stat-categorias').textContent     = `${cats} disciplina${cats !== 1 ? 's' : ''}`;

    // Botones de navegación
    document.getElementById('btn-anterior').disabled = (indiceSemanaActual === 0);
    document.getElementById('btn-siguiente').disabled = (indiceSemanaActual === SEMANAS.length - 1);
}

/* ─────────────────────────────────────────────────────────
   NAVEGACIÓN ENTRE SEMANAS (con animación)
───────────────────────────────────────────────────────── */
function cambiarSemana(delta) {
    const newIdx = indiceSemanaActual + delta;
    if (newIdx < 0 || newIdx >= SEMANAS.length) return;

    const grid      = document.getElementById('cuadricula-entrenamientos');
    const direction = delta > 0 ? -1 : 1;   // -1 = slide izquierda, 1 = slide derecha

    // Fase 1: sacar hacia afuera
    grid.style.transition = 'opacity .18s ease, transform .18s ease';
    grid.style.opacity    = '0';
    grid.style.transform  = `translateX(${direction * -24}px)`;

    setTimeout(() => {
        indiceSemanaActual = newIdx;
        renderizarSemana();

        // Fase 2: posicionar en el lado opuesto sin animación
        grid.style.transition = 'none';
        grid.style.opacity    = '0';
        grid.style.transform  = `translateX(${direction * 24}px)`;

        // Fase 3: entrar con animación
        requestAnimationFrame(() => requestAnimationFrame(() => {
            grid.style.transition = 'opacity .28s ease, transform .28s ease';
            grid.style.opacity    = '1';
            grid.style.transform  = 'translateX(0)';
        }));
    }, 180);
}

/* ─────────────────────────────────────────────────────────
   MODAL – ABRIR
───────────────────────────────────────────────────────── */
function abrirModal(cardId) {
    const week = SEMANAS[indiceSemanaActual];
    const card = week.cards.find(c => c.id === cardId);
    if (!card) return;

    const cat         = CATEGORIAS[card.cat];
    const modalHeader = week.isPast ? 'cm-pasado' : cat.claseModal;

    const notesHtml = card.notes.map(note => `
        <div class="item-seccion-modal">
            <span class="icono-item-modal">${ICONOS.shirt}</span>
            <span class="texto-item-modal">${note}</span>
        </div>`).join('');

    document.getElementById('interior-modal').innerHTML = `
        <!-- Cabecera del modal -->
        <div class="cabecera-modal ${modalHeader}">
            <div class="fila-titulo-modal">
                <div class="icono-categoria-modal">${cat.icon}</div>
                <span class="titulo-modal">${cat.name}</span>
            </div>
            <button class="cerrar-modal" onclick="cerrarModal()">${ICONOS.x}</button>
        </div>
        <!-- Cuerpo del modal -->
        <div class="cuerpo-modal">
            <h3 class="fecha-modal">${card.dateShort}</h3>
            <div class="info-modal">
                <div class="fila-info-modal">
                    <span class="icono-info-modal">${ICONOS.clock}</span>
                    <span class="texto-info-modal">${card.time}</span>
                </div>
                <div class="fila-info-modal">
                    <span class="icono-info-modal">${ICONOS.user}</span>
                    <span class="texto-info-modal">${card.trainer}</span>
                </div>
            </div>

            <div class="divisor-modal"></div>

            <!-- Sección: Enfoque -->
            <div class="seccion-modal">
                <div class="titulo-seccion-modal">
                    <span class="icono-seccion-modal">${ICONOS.target}</span>
                    <span class="texto-titulo-seccion-modal">Enfoque</span>
                </div>
                <div class="item-seccion-modal">
                    <span class="icono-item-modal">${ICONOS.users}</span>
                    <span class="texto-item-modal">${card.focus}</span>
                </div>
            </div>

            <div class="divisor-modal"></div>

            <!-- Sección: Indicaciones -->
            <div class="seccion-modal">
                <div class="titulo-seccion-modal">
                    <span class="texto-titulo-seccion-modal">Indicaciones</span>
                </div>
                ${notesHtml}
            </div>
        </div>`;

    document.getElementById('superposicion-modal').classList.add('activo');
    document.body.style.overflow = 'hidden';
}

/* ─────────────────────────────────────────────────────────
   MODAL – CERRAR
───────────────────────────────────────────────────────── */
function cerrarModal() {
    document.getElementById('superposicion-modal').classList.remove('activo');
    document.body.style.overflow = '';
}

/* ─────────────────────────────────────────────────────────
   INICIALIZACIÓN
───────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
    // Render inicial
    renderizarSemana();

    // Delegación de eventos: "Ver detalles"
    document.getElementById('cuadricula-entrenamientos').addEventListener('click', e => {
        const btn = e.target.closest('.btn-detalles[data-card-id]');
        if (btn) abrirModal(btn.dataset.cardId);
    });

    // Cerrar modal al hacer clic en el overlay
    document.getElementById('superposicion-modal').addEventListener('click', e => {
        if (e.target === document.getElementById('superposicion-modal')) cerrarModal();
    });

    // Cerrar modal con tecla ESC
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') cerrarModal();
    });
});
</script>
</body>
</html>
