<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Frontend Web/css/stylesAdmi.css">
    <link rel="stylesheet" href="Frontend Web/css/stylesAgre.css">
</head>
<body>
    <!-- BARRA 2 - Lateral izquierda -->
    <div class="Barra2">
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        <ul class="sidebar-menu">
            <li>
                <a href="#" title="Horarios">
                    <img src="Frontend Web/img/calendario.png" alt="Calendario">
                </a>
            </li>

            <li>
                <a href="#" title="Estado de cuentas">
                    <img src="Frontend Web/img/grafico-circular.png" alt="">
                </a>
            </li>

            <li>
                <a href="#" title="PQRS">
                    <img src="Frontend Web/img/comentarios.png" alt="">
                </a>
            </li>

            <!-- IMPLEMENTOS ACTIVO -->
            <li class="active">
                <a href="#" title="Implementos">
                    <img src="Frontend Web/img/Camisa.png" alt="">
                </a>
            </li>

            <li>
                <a href="#" title="Validación de Cuentas">
                    <img src="Frontend Web/img/usuarios.png" alt="">
                </a>
            </li>
        </ul>
    </div>

    <!-- BARRA 1 - Superior -->
    <header class="Barra1-contenedor">
        <nav>
            <div class="contenedor">
                <div class="Barra1">
                    <ul class="nav-btns">
                        <li><a href="#" class="btn-cerrar">Cerrar Sesión</a></li>
                        <li><span class="admin-btn">Administrador</span></li>
                    </ul>
                    <div id="Logo">
                        <a href="#" class="icon-link">
                            <img src="Frontend Web/img/campana-de-notificacion.png" alt="">
                        </a>
                        <a href="#" class="icon-link">
                            <img src="Frontend Web/img/casa.png" alt="">
                        </a>
                        <div class="logo-club">
                            <img src="Frontend Web/img/logo_transparent.png" alt="Logo del club">
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Inicia Registro de Implementos -->
    <div class="contenido-principal">
        <h1>Registrar Nuevo Implemento Deportivo</h1>
        <form class="formulario-registro">
            <div class="form-titulo">
                <h2>Registrar Nuevo Producto</h2>
            </div>

            <div class="grid-campos">
                <div class="imp-registro">
                    <label for="nombre">Nombre del producto</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Nombre del elemento">
                </div>
                
                <div class="imp-registro">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" class="form-control">
                        <option value="" disabled selected>Seleccione tipo de producto</option>
                        <option value="ropa">Ropa</option>
                        <option value="accesorios">Accesorios</option>
                        <option value="calzado">Calzado</option>
                    </select>
                </div>
                
                <div class="imp-registro">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" class="form-control" placeholder="Ingrese cantidad">
                </div>
                
                <div class="imp-registro">
                    <label for="estado">Estado</label>
                    <select id="estado" class="form-control">
                        <option value="" disabled selected>Seleccione estado</option>
                        <option value="disponible">Disponible</option>
                        <option value="noDisponible">No disponible</option>
                    </select>
                </div>
                
                <div class="imp-registro full-width">
                    <label for="precio">Precio</label>
                    <input type="number" id="precio" class="form-control" placeholder="Ingrese precio">
                </div>
    
                <div class="imp-registro full-width">
                    <label for="observaciones">Observaciones</label>
                    <textarea id="observaciones" class="form-control" placeholder="Notas u observaciones sobre el elemento..."></textarea>
                </div>
            </div>
            
            <div class="imp-registro full-width-foto">
                <label>Agregar Foto:</label>
                <div class="zona-drop" id="zonaDrop">
                    <input type="file" id="inputFoto" accept="image/*" style="display: none;">
                    <div class="contenido-drop" id="contenidoDrop">
                        <div class="icono-nube-placeholder">☁️</div>
                        <p>Arrastra una imagen aquí o <span class="resaltado-click">haga click para subir</span></p>
                    </div>
                    <img id="previstaFoto" style="display:none; max-width:100%; max-height:180px; border-radius:8px; object-fit:contain;">
                </div>
            </div>

            <div class="contenedor-bnt-guardar">
                <button type="button" class="btn-guardar" id="btn-guardar">Guardar Implemento</button>
            </div>
        </form>

        <script>
            // --- Zona de foto ---
            const zonaDrop = document.getElementById('zonaDrop');
            const inputFoto = document.getElementById('inputFoto');
            const contenidoDrop = document.getElementById('contenidoDrop');
            const previstaFoto = document.getElementById('previstaFoto');

            zonaDrop.addEventListener('click', () => inputFoto.click());

            inputFoto.addEventListener('change', () => {
                const archivo = inputFoto.files[0];
                if (archivo) mostrarPreview(archivo);
            });

            zonaDrop.addEventListener('dragover', (e) => {
                e.preventDefault();
                zonaDrop.style.borderColor = '#cc0000';
                zonaDrop.style.backgroundColor = '#fff5f5';
            });

            zonaDrop.addEventListener('dragleave', () => {
                zonaDrop.style.borderColor = '';
                zonaDrop.style.backgroundColor = '';
            });

            zonaDrop.addEventListener('drop', (e) => {
                e.preventDefault();
                zonaDrop.style.borderColor = '';
                zonaDrop.style.backgroundColor = '';
                const archivo = e.dataTransfer.files[0];
                if (archivo && archivo.type.startsWith('image/')) {
                    const dt = new DataTransfer();
                    dt.items.add(archivo);
                    inputFoto.files = dt.files;
                    mostrarPreview(archivo);
                }
            });

            function mostrarPreview(archivo) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previstaFoto.src = e.target.result;
                    previstaFoto.style.display = 'block';
                    contenidoDrop.style.display = 'none';
                };
                reader.readAsDataURL(archivo);
            }

            // --- Guardar ---
            document.getElementById('btn-guardar').addEventListener('click', () => {
                const nombre = document.getElementById('nombre').value.trim();
                const tipo = document.getElementById('tipo').value;
                const cantidad = document.getElementById('cantidad').value;
                const estado = document.getElementById('estado').value;
                const precio = document.getElementById('precio').value;

                if (!nombre || !tipo || !cantidad || !estado || !precio) {
                    alert('Por favor completa todos los campos obligatorios.');
                    return;
                }

                const archivo = inputFoto.files[0];

                const guardar = (imgSrc) => {
                    sessionStorage.setItem('nuevaImg', imgSrc);
                    const params = new URLSearchParams({ nombre, tipo, cantidad, estado, precio });
                    window.location.href = 'ImplementosAdmi.html?' + params.toString();
                };

                if (archivo) {
                    const reader = new FileReader();
                    reader.onload = (e) => guardar(e.target.result);
                    reader.readAsDataURL(archivo);
                } else {
                    guardar('Frontend Web/img/Uniforme.png');
                }
            });
        </script>
    </div>
</body>
</html>
